<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* Solarized, following the same scheme preference as the page. */
    .bg { fill: #fdf6e3; }  /* base3  */
    .fg { fill: #586e75; }  /* base01 */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #002b36; }  /* base03 */
      .fg { fill: #93a1a1; }  /* base1  */
    }
  </style>
  <rect class="bg" width="32" height="32"/>
  <text class="fg" x="16" y="25" font-family="serif" font-size="27" text-anchor="middle">&#11393;</text>
</svg>
