  <!-- ⲁ, U+2C81, as an outline traced from CS Avva Shenouda Unicode rather
       than set as <text>: a favicon is drawn without the page's @font-face
       rules, and almost no system serif covers the Coptic block, so a text
       node renders as a tofu box on the machines that matter most. -->
