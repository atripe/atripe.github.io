{% extends "base.html" %}

{% block title %}Tags — {{ config.title }}{% endblock %}

{% block content %}
<article class="prose">
  <h1>Tags</h1>
  <ul class="taglist">
    {% for term in terms %}
    <li><a class="tag" href="{{ term.permalink }}">{{ term.name }}</a> <span class="tag-count">{{ term.pages | length }}</span></li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
